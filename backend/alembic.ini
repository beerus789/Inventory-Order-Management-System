# Alembic configuration file

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# alembic section

[alembic]
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost/inventory_db
script_location = alembic
version_path_separator = :
version_locations = %(here)s/alembic/versions

[migration]
file_template = %%(rev)s_%%(slug)s
directory_template = %%(branch_label)s%%(branch_path)s

# Template used to generate migration file names; The default value is
# %%(rev)s_%%(slug)s.py. Uncomment and edit this value to use a different
# template.
# file_template = %%(rev)s_%%(slug)s

# sys.exit() -> raise SystemExit
# instead of
# sys.exit() -> return

# compare_type = false

# compare_server_default = false

