services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ""
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-require}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - inventory_network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: inventory_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge
